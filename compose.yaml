x-app: &app
  build: .
  image: autoinsight:local
services:
  training:
    <<: *app
    command: python -m autoinsight.training
    volumes:
      - ./data:/app/data:ro
      - models:/app/artifacts
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoinsight
      POSTGRES_USER: autoinsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoinsight_local}
    volumes:
      - history:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoinsight -d autoinsight"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    <<: *app
    depends_on:
      training:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://autoinsight:${POSTGRES_PASSWORD:-autoinsight_local}@db:5432/autoinsight
    volumes:
      - models:/app/artifacts:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
  dashboard:
    <<: *app
    command: gunicorn --bind 0.0.0.0:8050 autoinsight.dashboard:server
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:8050:8050"]
volumes:
  models:
  history:
